    VITE_SUPABASE_PUBLISHABLE_KEY: "seu_token_aqui"
    VITE_SUPABASE_URL: "https://ytlrgiklfnygbzrwhpdz.supabase.co"
    GITLAB_TOKEN: ${QAS_GITLAB_TOKEN}

deploy:prd:
  environment: prd
  variables:
    K8S_NAMESPACE: "prd-normastouch"
    GITLAB_TOKEN: ${PRD_GITLAB_TOKEN}
